<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.58 29.17 100.83 88.83">
  <defs>
    <linearGradient id="orbit-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="orbit-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Anneau secondaire (arrière-plan) -->
    <ellipse cx="60" cy="60" rx="50" ry="20" fill="none" stroke="url(#orbit-accent)" stroke-width="3.5" transform="rotate(-30 60 60)" opacity="0.7"/>

    <!-- Anneau principal (complet et continu) -->
    <ellipse cx="60" cy="60" rx="52" ry="22" fill="none" stroke="url(#orbit-primary)" stroke-width="5" transform="rotate(35 60 60)" filter="url(#soft-shadow)"/>

    <!-- Noyau central -->
    <circle cx="60" cy="60" r="14" fill="url(#orbit-primary)"/>
    <circle cx="60" cy="60" r="6" fill="#FFFFFF" opacity="0.9"/>

    <!-- Jobs / Workers en orbite -->
    <circle cx="102" cy="38" r="6" fill="#06B6D4" filter="url(#soft-shadow)"/>
    <circle cx="18" cy="82" r="5" fill="#D946EF"/>
    <circle cx="78" cy="104" r="4" fill="#3B82F6"/>
  </g>
</svg>